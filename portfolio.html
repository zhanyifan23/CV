<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maggie Zhang · Academic Works</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="archive-page">
  <nav class="site-nav container" aria-label="Primary navigation">
    <a class="brand-mark" href="index.html#top" aria-label="Maggie Zhang home">MZ<span>/</span>26</a>
    <div class="nav-links">
      <a href="index.html#about">About</a>
      <a href="portfolio.html" aria-current="page">Archive</a>
      <a href="index.html#contact">Contact</a>
    </div>
  </nav>

  <main class="archive-main">
    <section id="projects" class="container section reveal in-view">
      <div class="section-heading">
        <div>
          <p class="eyebrow">ACADEMIC WORKS · SELECTED ARCHIVE</p>
          <h1>Academic Works</h1>
        </div>
        <p class="section-note">Selected publications, research, exhibitions and painting studies.</p>
      </div>
      <div class="portfolio-toolbar" aria-label="Academic work filters">
        <div id="portfolio-filters" class="filter-list" role="group" aria-label="Filter by category"></div>
        <span id="portfolio-count" class="portfolio-count" aria-live="polite"></span>
      </div>
      <div id="portfolio-grid" class="portfolio-grid" aria-live="polite"></div>
      <div id="portfolio-empty" class="portfolio-empty" hidden>No works match this filter.</div>
      <dialog id="portfolio-dialog" class="portfolio-dialog">
        <button class="dialog-close" type="button" aria-label="Close work details">×</button>
        <div id="portfolio-detail"></div>
      </dialog>
      <noscript>Enable JavaScript to view the academic works archive.</noscript>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© Maggie Zhang · Academic Works Archive</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="script.js"></script>

</html>
